<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Coin Magnet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff}
#cv{will-change:contents}
#wrap{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1a0d22 0%,#05050a 70%)}
#stage{position:absolute;left:50%;top:50%;transform-origin:0 0;overflow:hidden;background:#05050a}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
#sWin{z-index:5}
#sWin .ov{background:radial-gradient(ellipse at 50% 35%,rgba(254,44,85,.28),transparent 60%),rgba(6,4,12,.72);animation:fin .5s ease-out}
@keyframes fin{from{opacity:0}}
#sWin .ov>*:not(.confetti){animation:up .55s cubic-bezier(.2,1.4,.4,1) both}
#sWin .big{animation-delay:.08s!important}#sWin .sub{animation-delay:.14s!important}#sWin .field{animation-delay:.2s!important}#sWin .btn{animation-delay:.26s!important}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.9)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(14px + var(--sat,0px)) 16px 0;pointer-events:none;z-index:3}
.hudrow{display:flex;align-items:center;justify-content:space-between}
.logo{white-space:nowrap;font-weight:900;font-size:21px;letter-spacing:-.5px;text-shadow:-2px -1px 0 #25F4EE,2px 1px 0 #FE2C55;font-style:italic}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 12px 5px 5px;border-radius:30px;font-weight:800;font-size:17px;}
.pill img{width:28px;height:28px}
.gbal{font-size:22px;min-width:185px;margin-left:10px;height:48px;padding:5px 16px 5px 6px;justify-content:space-between;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,rgba(255,190,60,.22),rgba(255,140,30,.1));border-color:rgba(255,200,90,.4);box-shadow:0 0 16px rgba(255,170,50,.25);transition:transform .12s}
.gfeed{margin-top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gfeed .gr{display:flex;align-items:center;gap:8px;background:rgba(10,8,18,.78);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:5px 12px 5px 5px;font-size:13px;font-weight:700;animation:gin .3s cubic-bezier(.2,1.3,.4,1);transition:opacity .4s,transform .4s}
.gfeed .gr img{width:24px;height:24px}
.gfeed .gr b{color:#ffcf4a;font-size:14px;margin-left:4px}
.gfeed .gr.old{opacity:.45;transform:scale(.94)}
@keyframes gin{from{opacity:0;transform:translateX(40px)}}
.gbal.bump{transform:scale(1.12)}
.gbal img{width:36px;height:36px}
.gbal span{flex:1;text-align:right}
.bar{margin-top:12px;height:10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#25F4EE,#fff 50%,#FE2C55);border-radius:10px;transition:width .25s;box-shadow:0 0 12px #25F4EE}
.hint{position:absolute;left:0;right:0;bottom:calc(215px + var(--sab,0px));text-align:center;font-weight:800;font-size:17px;pointer-events:none;z-index:3;transition:opacity .4s;text-shadow:0 2px 8px #000}
.hint small{display:block;font-weight:600;font-size:13px;opacity:.7;margin-top:4px}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:20px;color:#ffd34d;text-shadow:0 0 8px #ff9a1a,0 2px 0 #7a3b00;z-index:4;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-80%) scale(1.2);opacity:1}100%{transform:translate(-50%,-220%) scale(1);opacity:0}}

/* overlays */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(254,44,85,.35),transparent 60%),radial-gradient(ellipse at 50% 80%,rgba(37,244,238,.25),transparent 60%),#07060c}
.coin3d{width:170px;height:170px;perspective:600px;margin-bottom:10px}
.coin3d div{width:100%;height:100%;background-size:contain;background-repeat:no-repeat;background-position:center;animation:spin 2.4s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(255,150,30,.45))}
@keyframes spin{0%,100%{transform:rotateY(-55deg) translateY(0)}50%{transform:rotateY(55deg) translateY(-12px)}}
.big{font-size:36px;font-weight:900;font-style:italic;letter-spacing:-1px;text-shadow:-3px -2px 0 #25F4EE,3px 2px 0 #FE2C55;line-height:1.05}
.sub{margin-top:10px;font-size:16px;font-weight:600;opacity:.85}
.field{margin-top:26px;width:100%;max-width:330px;display:flex;align-items:center;background:#16151d;border:2px solid #2c2a36;border-radius:16px;padding:0 6px 0 16px;height:58px;transition:border-color .2s}
.field.ok{border-color:#25F4EE;box-shadow:0 0 18px rgba(37,244,238,.25)}
.field span{font-size:20px;font-weight:800;opacity:.6}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-family:inherit;font-weight:700;font-size:19px;padding:0 6px;user-select:text;-webkit-user-select:text}
.field input::placeholder{color:#6b6878;font-weight:600}
.paste{background:linear-gradient(135deg,#25F4EE,#FE2C55);border:0;border-radius:12px;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:0 4px 14px rgba(254,44,85,.35)}
.paste svg{width:24px;height:24px}
.paste:active{transform:scale(.95)}
.btn{margin-top:18px;width:100%;max-width:330px;height:58px;border:0;border-radius:16px;background:#FE2C55;color:#fff;font-family:inherit;font-weight:900;font-size:19px;letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 0 #a3132f,0 10px 28px rgba(254,44,85,.45);transition:opacity .2s,transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3132f}
.btn[disabled]{opacity:.35;pointer-events:none}
.ov>*:not(.confetti){position:relative;z-index:1}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* loading */
.spinner{width:84px;height:84px;border-radius:50%;position:relative;margin-bottom:26px}
.spinner:before,.spinner:after{content:"";position:absolute;inset:0;border-radius:50%;border:6px solid transparent}
.spinner:before{border-top-color:#25F4EE;animation:rot 1s linear infinite}
.spinner:after{border-bottom-color:#FE2C55;animation:rot 1s linear infinite reverse;inset:12px}
@keyframes rot{to{transform:rotate(360deg)}}
.lt{font-size:20px;font-weight:800}
.ls{margin-top:8px;font-size:15px;opacity:.65;min-height:20px}
.lbar{margin-top:22px;width:260px;height:8px;border-radius:8px;background:#1d1b25;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#25F4EE,#FE2C55)}

/* account */
.acc{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
.atop{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--sat,0px)) 14px 8px}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back svg{width:26px;height:26px}
.prof{display:flex;flex-direction:column;align-items:center;padding-top:18px}
.ava{width:96px;height:96px;border-radius:50%;padding:3px;background:conic-gradient(#25F4EE,#FE2C55,#25F4EE)}
.ava div{width:100%;height:100%;border-radius:50%;background:#1b1a22;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}
.uname{margin-top:12px;font-size:20px;font-weight:800}
.ver{margin-top:4px;font-size:13px;opacity:.55}
.card{margin:26px 16px 0;border-radius:22px;padding:22px 18px 20px;background:linear-gradient(145deg,#2b1a0a,#170d04 60%,#0f0903);border:1px solid rgba(255,190,80,.25);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,50,.35),transparent 70%)}
.clab{font-size:14px;font-weight:700;opacity:.7;position:relative}
.cval{display:flex;align-items:center;gap:10px;margin-top:8px;position:relative}
.cval img{width:46px;height:46px}
.cval b{font-size:44px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.cval.bump b{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.06)}}
.chips{display:flex;gap:8px;margin-top:16px;position:relative;flex-wrap:wrap}
.chip{font-size:13px;font-weight:800;padding:6px 11px;border-radius:20px;background:rgba(37,244,238,.12);color:#25F4EE}
.chip.p{background:rgba(254,44,85,.14);color:#ff5c7c}
.feed{margin:18px 16px 0;flex:1;overflow:hidden}
.feed h4{font-size:15px;opacity:.6;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #18171e;animation:slide .35s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(-20px)}}
.row img{width:34px;height:34px}
.row .t{flex:1;font-weight:700;font-size:15px}
.row .t small{display:block;font-weight:500;opacity:.5;font-size:12px;margin-top:2px}
.row b{color:#ffcf4a;font-size:16px}
.fly{position:absolute;width:40px;height:40px;z-index:9;pointer-events:none}
.done{margin:8px 16px calc(18px + var(--sab,0px));text-align:center;font-weight:800;font-size:14px;opacity:0;transition:opacity .5s;color:#25F4EE}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <!-- GAME -->
  <div class="screen on" id="sGame">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hudrow">
        <div class="logo">Coin Magnet</div>
        <div class="pill gbal" id="gBal"><img class="ci" alt=""><span id="gBalT">0</span></div>
      </div>
      <div class="gfeed" id="gFeed"></div>
    </div>
  </div>

  <!-- CONGRATS -->
  <div class="screen" id="sWin">
    <div class="ov">
      <div class="confetti" id="conf"></div>
      <div class="coin3d"><div class="cbg"></div></div>
      <div class="big">CONGRATULATIONS!</div>
      <div class="sub">You collected <b id="wN">0</b> coins 🎉<br>Enter your nickname to continue</div>
      <div class="field" id="fld"><span>@</span><input id="nick" placeholder="nickname" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="paste" id="paste" aria-label="Generate"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h1.5A2.5 2.5 0 0 1 20 7.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-11A2.5 2.5 0 0 1 6.5 5H8"/><path d="M12 11l1 2.2 2.2 1-2.2 1L12 17.4l-1-2.2-2.2-1 2.2-1z" fill="#fff" stroke="none"/></svg></button></div>
      <button class="btn" id="go" disabled>CONTINUE</button>
    </div>
  </div>

  <!-- LOADING -->
  <div class="screen" id="sLoad">
    <div class="ov">
      <div class="spinner"></div>
      <div class="lt" id="lt">Searching @user…</div>
      <div class="ls" id="ls">Connecting…</div>
      <div class="lbar"><i id="lb"></i></div>
    </div>
  </div>

  <!-- ACCOUNT -->
  <div class="screen" id="sAcc">
    <div class="acc">
      <div class="atop">
        <div class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></div>
        <div style="font-weight:800;font-size:17px">Balance</div>
        <div class="pill" id="topBal" style="font-size:15px"><img class="ci" alt=""><span id="topBalT">0</span></div>
      </div>
      <div class="prof">
        <div class="ava"><div id="avaL">A</div></div>
        <div class="uname" id="uname">@user</div>
        <div class="ver">Account found ✓</div>
      </div>
      <div class="card">
        <div class="clab">Coins</div>
        <div class="cval" id="cval"><img class="ci" alt=""><b id="balT">0</b></div>
        
      </div>
      <div style="flex:1"></div>
      <div class="done" id="done">Tap the balance to play again</div>
    </div>
  </div>

</div></div>

/* ---------- fit ---------- */
const stage=document.getElementById('stage');
let SW=390,SH=844,SC=1;
function fit(){
  const vv=window.visualViewport;
  const vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
  SC=Math.min(vw/390,vh/760);
  SW=Math.min(vw/SC,500); SH=vh/SC;
  stage.style.width=SW+'px';stage.style.height=SH+'px';
  stage.style.transform='scale('+SC+') translate(-50%,-50%)';
  resizeCanvas();
}
addEventListener('resize',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);

/* Android fullscreen on first touch */
let fsTried=false;
function tryFS(){if(fsTried)return;fsTried=true;
  if(/Android/i.test(navigator.userAgent)){const d=document.documentElement;
    const f=d.requestFullscreen||d.webkitRequestFullscreen;if(f)try{const p=f.call(d,{navigationUI:'hide'});p&&p.catch&&p.catch(()=>{})}catch(e){}}}
addEventListener('pointerdown',tryFS,{capture:true});

/* ---------- screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id||(id==='sWin'&&s.id==='sGame')))}
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- game ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
const sGameEl=document.getElementById('sGame'),gBalEl=document.getElementById('gBal'),gBalTEl=document.getElementById('gBalT');
let DPR=1,bgLayer=null;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function resizeCanvas(){DPR=Math.min(2,(window.devicePixelRatio||1)*SC);cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);buildBg()}

/* static background, rendered once per resize */
function buildBg(){
  const W=SW,H=SH;bgLayer=mk(Math.round(W*DPR),Math.round(H*DPR));const c=bgLayer.getContext('2d');c.scale(DPR,DPR);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07040d');g.addColorStop(.55,'#140a1e');g.addColorStop(1,'#04030a');c.fillStyle=g;c.fillRect(0,0,W,H);
  let rg=c.createRadialGradient(W*.15,H*.3,0,W*.15,H*.3,W*.8);rg.addColorStop(0,'rgba(37,244,238,.18)');rg.addColorStop(1,'rgba(37,244,238,0)');c.fillStyle=rg;c.fillRect(0,0,W,H);
  rg=c.createRadialGradient(W*.9,H*.55,0,W*.9,H*.55,W*.8);rg.addColorStop(0,'rgba(254,44,85,.2)');rg.addColorStop(1,'rgba(254,44,85,0)');c.fillStyle=rg;c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=.07;c.font='900 '+(W*.6)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillStyle='#25F4EE';c.fillText('♪',W/2-6,H*.3-4);c.fillStyle='#FE2C55';c.fillText('♪',W/2+6,H*.3+4);c.restore();
  const hz=H*.42,vx=W/2;
  const fg=c.createLinearGradient(0,hz,0,H);fg.addColorStop(0,'rgba(254,44,85,0)');fg.addColorStop(1,'rgba(254,44,85,.12)');c.fillStyle=fg;c.fillRect(0,hz,W,H-hz);
  c.save();c.beginPath();c.rect(0,hz,W,H-hz);c.clip();c.lineWidth=1.2;
  for(let i=-14;i<=14;i++){const a=.12+.25*(1-Math.abs(i)/14);c.strokeStyle=i%2?'rgba(254,44,85,'+a+')':'rgba(37,244,238,'+a+')';c.beginPath();c.moveTo(vx+i*6,hz);c.lineTo(vx+i*W*.22,H);c.stroke()}
  c.restore();
  const hg=c.createLinearGradient(0,hz-30,0,hz+30);hg.addColorStop(0,'rgba(37,244,238,0)');hg.addColorStop(.5,'rgba(120,255,250,.35)');hg.addColorStop(1,'rgba(37,244,238,0)');c.fillStyle=hg;c.fillRect(0,hz-30,W,60);
}

/* coin sprite with baked glow */
const CS=128,coinSpr=mk(CS,CS);
function buildCoin(){const c=coinSpr.getContext('2d');c.clearRect(0,0,CS,CS);
  const gg=c.createRadialGradient(64,64,0,64,64,64);gg.addColorStop(0,'rgba(255,190,60,.55)');gg.addColorStop(.55,'rgba(255,170,40,.18)');gg.addColorStop(1,'rgba(255,170,40,0)');c.fillStyle=gg;c.fillRect(0,0,CS,CS);
  c.drawImage(coinImg,64-38,64-39,76,76*300/289);}
coinImg.onload=buildCoin;if(coinImg.complete)buildCoin();

/* magnet sprite */
const MS=2,magSpr=mk(130*MS,150*MS);
function buildMagnet(){const c=magSpr.getContext('2d');c.setTransform(MS,0,0,MS,65*MS,90*MS);
  const R=30,L=44,wd=30;
  const U=()=>{c.beginPath();c.moveTo(-R,-L);c.lineTo(-R,0);c.arc(0,0,R,Math.PI,0,true);c.lineTo(R,-L)};
  c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.ellipse(4,52,42,9,0,0,7);c.fill();
  c.lineCap='butt';
  c.save();c.translate(5,6);c.lineWidth=wd;c.strokeStyle='#3a0d18';U();c.stroke();c.restore();
  c.save();c.beginPath();c.rect(-80,-80,80,160);c.clip();
  let gr=c.createLinearGradient(-R-wd/2,0,-R+wd/2,0);gr.addColorStop(0,'#0aa6a2');gr.addColorStop(.45,'#7ffcf8');gr.addColorStop(1,'#13c8c3');
  c.lineWidth=wd;c.strokeStyle=gr;U();c.stroke();c.restore();
  c.save();c.beginPath();c.rect(0,-80,80,160);c.clip();
  gr=c.createLinearGradient(R-wd/2,0,R+wd/2,0);gr.addColorStop(0,'#c4143a');gr.addColorStop(.5,'#ff6d8c');gr.addColorStop(1,'#d81a43');
  c.lineWidth=wd;c.strokeStyle=gr;U();c.stroke();c.restore();
  c.lineWidth=4;c.strokeStyle='rgba(255,255,255,.45)';c.beginPath();c.moveTo(-R-8,-L+2);c.lineTo(-R-8,0);c.arc(0,0,R+8,Math.PI,Math.PI*.62,true);c.stroke();
  for(const sx of[-R,R]){
    c.fillStyle='#2b2b33';c.fillRect(sx-wd/2+5,-L-12,wd,18);
    const sg=c.createLinearGradient(sx-wd/2,0,sx+wd/2,0);sg.addColorStop(0,'#9aa0ab');sg.addColorStop(.4,'#ffffff');sg.addColorStop(1,'#8a909b');
    c.fillStyle=sg;c.fillRect(sx-wd/2,-L-18,wd,18);c.fillStyle='rgba(255,255,255,.9)';c.fillRect(sx-wd/2,-L-18,wd,3);
  }
  c.font='900 22px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillStyle='#25F4EE';c.fillText('♪',-2,14);c.fillStyle='#FE2C55';c.fillText('♪',2,16);c.fillStyle='#fff';c.fillText('♪',0,15);
}
buildMagnet();

let coins=[],parts=[],stars=[],pops=[],rings=[],mag={x:0,y:0,tx:0,ty:0},collected=0,gBal=0,gShown=0,gShownTxt=-1,playing=true,touched=false,t0=performance.now(),field=0;
function rnd(a,b){return a+Math.random()*(b-a)}
let lastPop=0,startT=0,spawned=0,spawnT=0,trail=[],gt=0,alive=0,lastVib=0,lastFeed=0,lastTxt=0;
function spawnCoin(delay){
  if(spawned>=TOTAL)return;spawned++;
  const top=125,bot=SH-200;let x,y,ok,tries=0;
  do{x=rnd(40,SW-40);y=rnd(top,bot);ok=Math.hypot(x-mag.x,y-(mag.y-60))>100;if(ok)for(const c of coins){if(!c.got&&Math.abs(c.x-x)<32&&Math.abs(c.y-y)<32){ok=false;break}}tries++}while(!ok&&tries<30);
  const a=Math.random()*6.28,sp=rnd(18,40);
  coins.push({x,y,vx:0,vy:0,dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,ph:Math.random()*6.28,sp:rnd(2.5,4.5),s:rnd(30,40),got:false,pull:0,born:gt+(delay||0),sc:1});
}
function initGame(){
  coins=[];parts=[];pops=[];rings=[];collected=0;gBal=0;gShown=0;gShownTxt=-1;document.getElementById('gFeed').innerHTML='';gBalTEl.textContent='0';playing=true;touched=false;
  spawned=0;spawnT=0;trail=[];
  for(let i=0;i<30;i++)spawnCoin(i*0.03);
  stars=[];for(let i=0;i<50;i++)stars.push({x:Math.random(),y:Math.random()*.42,r:rnd(1,2.6),p:Math.random()*6});
  mag.x=mag.tx=SW/2;mag.y=mag.ty=SH-120;
}
function updHud(){}
const FEEDTXT=['Coin collected','Magnet pull','Nice catch!','Coin collected','Bonus coin'];
function addFeed(n){const f=document.getElementById('gFeed');const r=document.createElement('div');r.className='gr';r.innerHTML='<img src="'+COIN+'">'+FEEDTXT[Math.random()*FEEDTXT.length|0]+'<b>+'+fmt(n)+'</b>';f.prepend(r);const ch=f.children;for(let i=ch.length-1;i>=0;i--){if(i>=3)ch[i].remove();else ch[i].classList.toggle('old',i>0)}}

function toStage(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
let dragging=false;
cv.addEventListener('pointerdown',e=>{if(!playing)return;dragging=true;const p=toStage(e);mag.tx=p.x;mag.ty=p.y-60;if(!touched){touched=true;startT=performance.now()}});
addEventListener('pointermove',e=>{if(!dragging)return;const p=toStage(e);mag.tx=p.x;mag.ty=p.y-60},{passive:true});
addEventListener('pointerup',()=>dragging=false);addEventListener('pointercancel',()=>dragging=false);

function drawBg(t){
  const W=SW,H=SH;
  ctx.drawImage(bgLayer,0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=.3+.5*Math.abs(Math.sin(t*1.5+s.p));ctx.fillRect(s.x*W,s.y*H,s.r,s.r)}
  ctx.globalAlpha=1;
  const hz=H*.42,off=(t*.6)%1;
  ctx.lineWidth=1.2;ctx.strokeStyle='#25F4EE';
  for(let k=0;k<12;k++){const z=(k+off)/12;const y=hz+(H-hz)*z*z;ctx.globalAlpha=.08+z*.35;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.globalAlpha=1;
}

function drawCoin(c,t){
  const bob=c.cap?0:Math.sin(t*2+c.ph)*5*(1-c.pull);
  const spin=Math.cos(t*c.sp+c.ph);
  const sx=Math.max(.12,Math.abs(spin));
  const age=t-c.born,pop=age<.45?(1-Math.pow(1-age/.45,3))*(1+Math.sin(age/.45*Math.PI)*.35):1;
  const s=c.s*pop*(1+c.pull*.12)*c.sc;
  const y=c.y+bob;
  const edge=(1-sx)*s*.14;
  if(edge>.6){ctx.fillStyle='#b8661a';ctx.beginPath();ctx.ellipse(c.x+(spin>0?-edge*.6:edge*.6),y,s*.47*sx+edge*.6,s*.47,0,0,7);ctx.fill()}
  const S=s*CS/76;
  ctx.drawImage(coinSpr,c.x-S*sx/2,y-S/2,S*sx,S);
}

function drawMagnet(x,y,t,pow,tl){
  ctx.save();ctx.translate(x,y);
  ctx.rotate((tl||0)+Math.sin(t*22)*pow*.025);ctx.scale(1.12,1.12);
  ctx.lineWidth=2.5;
  for(let i=0;i<3;i++){const k=((t*1.4+i/3)%1);ctx.strokeStyle='rgba(120,255,250,'+((1-k)*(.25+pow*.5)).toFixed(3)+')';ctx.beginPath();ctx.arc(0,-48,20+k*110,Math.PI*1.12,Math.PI*1.88);ctx.stroke()}
  ctx.drawImage(magSpr,-65,-90,130,150);
  if(pow>.05){ctx.fillStyle='rgba(255,255,255,'+pow.toFixed(2)+')';for(const sx of[-30,30])ctx.fillRect(sx+rnd(-6,6),-64+rnd(-4,2),rnd(2,4),rnd(2,4))}
  ctx.restore();
}

function finish(){
  playing=false;vib([30,40,60]);
  for(let i=0;i<60;i++)parts.push({x:mag.x,y:mag.y-60,vx:rnd(-9,9),vy:rnd(-12,4),l:1,c:Math.random()<.5?'#25F4EE':(Math.random()<.5?'#FE2C55':'#ffcc33'),r:rnd(3,6)});
  setTimeout(openWin,700);
}

function onCollect(px,py,now){
  collected++;const add=100+Math.floor(Math.random()*901);gBal+=add;
  if(now-lastPop>110){lastPop=now;pops.push({x:px+rnd(-34,34),y:py-10+rnd(-12,6),l:1,t:'+'+add})}
  if(now-lastVib>90){vib(8);lastVib=now}
  if(now-lastFeed>160){lastFeed=now;addFeed(add);gBalEl.classList.add('bump');setTimeout(()=>gBalEl.classList.remove('bump'),120)}
  if(rings.length<12)rings.push({x:px,y:py,l:1});
  if(parts.length<140)for(let i=0;i<6;i++)parts.push({x:px,y:py,vx:rnd(-3.5,3.5),vy:rnd(-5,1),l:1,c:i%2?'#ffd34d':'#bffffb',r:rnd(2,4)});
}

let last=performance.now(),tilt=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  if(!sGameEl.classList.contains('on')||!bgLayer)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  gt=t;
  if(playing&&touched&&(now-startT)/1000>=GAME_TIME)finish();
  drawBg(t);
  if(coins.length>70)coins=coins.filter(c=>!c.got);
  alive=0;for(const c of coins)if(!c.got)alive++;
  if(playing&&spawned<TOTAL){spawnT-=dt;if(spawnT<=0&&alive<45){spawnCoin(0);spawnCoin(0.04);if(Math.random()<.5)spawnCoin(0.08);spawnT=alive<15?0.04:rnd(0.08,0.15)}}
  if(!playing){mag.tx=SW/2;mag.ty=SH*.82;}
  mag.tx=Math.max(44,Math.min(SW-44,mag.tx));mag.ty=Math.max(130,Math.min(SH-70,mag.ty));
  const ox=mag.x;
  const k=1-Math.exp(-dt*(playing?11:4));
  mag.x+=(mag.tx-mag.x)*k;mag.y+=(mag.ty-mag.y)*k;
  const idle=(!touched||!playing)?Math.sin(t*2.2)*6:0;
  tilt+=(Math.max(-.35,Math.min(.35,(mag.x-ox)*.025))-tilt)*Math.min(1,dt*10);
  const MY=mag.y+idle;
  const px=mag.x+Math.sin(tilt)*62,py=MY-62*Math.cos(tilt);let pw=0;
  const RANGE=190,R2=RANGE*RANGE;
  const damp=Math.pow(.02,dt);
  ctx.beginPath();let beams=false;
  for(const c of coins){if(c.got||t<c.born)continue;
    if(c.cap){
      c.ct+=dt/0.28;const e=Math.min(1,c.ct);const ee=e*e*(3-2*e);
      const ang=c.ca+ee*2.2,rr=c.cr*(1-ee);
      c.x=px+Math.cos(ang)*rr;c.y=py+Math.sin(ang)*rr;c.sc=1-ee*.75;
      if(e>=1){c.got=true;onCollect(px,py,now)}
      continue;}
    const dx=px-c.x,dy=py-c.y,d2=dx*dx+dy*dy;
    if(playing&&touched&&d2<R2){
      const d=Math.sqrt(d2)||1,f=1-d/RANGE;c.pull=Math.min(1,c.pull+dt*3);if(f>pw)pw=f;
      const a=(520*f*f+260)*dt;c.vx+=dx/d*a;c.vy+=dy/d*a;
      ctx.moveTo(c.x,c.y);ctx.lineTo(px,py);beams=true;
      if(d<58){c.cap=true;c.ct=0;c.cr=d;c.ca=Math.atan2(c.y-py,c.x-px);}
    }else if(c.pull>0){c.pull=Math.max(0,c.pull-dt*2)}
    c.vx*=damp;c.vy*=damp;
    const fr=1-c.pull;c.x+=c.vx*dt*8+c.dx*dt*fr;c.y+=c.vy*dt*8+c.dy*dt*fr;
    if(c.x<34){c.x=34;c.dx=Math.abs(c.dx)}else if(c.x>SW-34){c.x=SW-34;c.dx=-Math.abs(c.dx)}
    if(c.y<120){c.y=120;c.dy=Math.abs(c.dy)}else if(c.y>SH-60){c.y=SH-60;c.dy=-Math.abs(c.dy)}
  }
  if(beams){ctx.strokeStyle='rgba(160,255,250,.28)';ctx.lineWidth=2;ctx.stroke()}
  if(gShown<gBal){gShown=Math.min(gBal,gShown+Math.max(4,(gBal-gShown)*dt*8))}
  if(now-lastTxt>60){const v=Math.round(gShown);if(v!==gShownTxt){gShownTxt=v;gBalTEl.textContent=fmt(v)}lastTxt=now}
  field+=(pw-field)*Math.min(1,dt*6);
  // shadows in one pass
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();
  for(const c of coins)if(!c.got&&t>=c.born&&!c.cap){const s=c.s;ctx.moveTo(c.x+s*.42,c.y+s*.62);ctx.ellipse(c.x,c.y+s*.62,s*.42,s*.1,0,0,6.283)}
  ctx.fill();
  for(const c of coins)if(!c.got&&t>=c.born){
    if(!c.fx){c.fx=1;if(rings.length<12)rings.push({x:c.x,y:c.y,l:1,col:'#78fffa'});if(parts.length<140)for(let i=0;i<4;i++)parts.push({x:c.x,y:c.y,vx:rnd(-3,3),vy:rnd(-3,3),l:.7,c:i%2?'#25F4EE':'#FE2C55',r:rnd(2,3)})}
    drawCoin(c,t)}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.l-=dt*2.5;if(r.l<=0){rings.splice(i,1);continue}
    ctx.globalAlpha=r.l;ctx.strokeStyle=r.col||'#ffd75a';ctx.lineWidth=3*r.l;ctx.beginPath();ctx.arc(r.x,r.y,8+(1-r.l)*34,0,6.283);ctx.stroke()}
  ctx.globalAlpha=1;
  trail.push({x:mag.x,y:MY-10});if(trail.length>9)trail.shift();
  ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];if(Math.abs(b.x-a.x)+Math.abs(b.y-a.y)<1.5)continue;const k=i/trail.length;
    ctx.globalAlpha=k*.35;ctx.lineWidth=26*k;
    ctx.strokeStyle='#25F4EE';ctx.beginPath();ctx.moveTo(a.x-12,a.y);ctx.lineTo(b.x-12,b.y);ctx.stroke();
    ctx.strokeStyle='#FE2C55';ctx.beginPath();ctx.moveTo(a.x+12,a.y);ctx.lineTo(b.x+12,b.y);ctx.stroke()}
  ctx.globalAlpha=1;ctx.lineCap='butt';
  drawMagnet(mag.x,MY,t,field,tilt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=12*dt;p.l-=dt*1.3;if(p.l<=0){parts.splice(i,1);continue}
    ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r)}
  if(pops.length){ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#5a2a00';ctx.fillStyle='#ffd34d';
    for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.l-=dt*1.6;p.y-=dt*70;if(p.l<=0){pops.splice(i,1);continue}
      ctx.globalAlpha=Math.min(1,p.l*1.5);ctx.strokeText(p.t,p.x,p.y);ctx.fillText(p.t,p.x,p.y)}}
  ctx.globalAlpha=1;
}

/* ---------- win ---------- */
const nick=document.getElementById('nick'),go=document.getElementById('go'),fld=document.getElementById('fld');
function openWin(){
  show('sWin');nick.value='';chk();
  document.getElementById('wN').textContent=fmt(collected);
  const cf=document.getElementById('conf');cf.innerHTML='';
  const cols=['#25F4EE','#FE2C55','#ffffff','#ffcc33'];
  for(let i=0;i<50;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%4];e.style.animationDuration=rnd(2.2,4.5)+'s';e.style.animationDelay=(-Math.random()*4)+'s';cf.appendChild(e)}
}
function chk(){const ok=nick.value.trim().length>=3;go.disabled=!ok;fld.classList.toggle('ok',ok)}
nick.addEventListener('input',()=>{nick.value=nick.value.replace(/[^a-zA-Z0-9_.]/g,'');chk()});
const A=['lil','its','real','the','xx','official','not','im','just','hey'],B=['mango','tiktoker','vibes','kitty','gamer','star','sunny','bunny','dream','shadow','pixel','honey','storm','ninja','cherry'],C=['_','.','','__'];
function genNick(){const pick=a=>a[Math.random()*a.length|0];let n=(Math.random()<.6?pick(A)+pick(C):'')+pick(B)+pick(C)+(Math.random()*999|0);return n.slice(0,20)}
document.getElementById('paste').addEventListener('click',e=>{e.preventDefault();vib(10);
  nick.value=genNick();chk()});
go.addEventListener('click',()=>{nick.blur();openAcc(nick.value.trim())});
nick.addEventListener('keydown',e=>{if(e.key==='Enter'&&!go.disabled){nick.blur();openAcc(nick.value.trim())}});

/* ---------- loading ---------- */
let timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function startLoad(n){
  show('sLoad');
  document.getElementById('lt').textContent='Searching @'+n+'…';
  const steps=['Connecting…','Account found ✓','Syncing magnet coins…','Applying bonus…','Almost done…'];
  const lb=document.getElementById('lb');lb.style.transition='none';lb.style.width='0';
  requestAnimationFrame(()=>{lb.style.transition='width 3.2s linear';lb.style.width='100%'});
  steps.forEach((s,i)=>later(()=>document.getElementById('ls').textContent=s,i*650));
  later(()=>openAcc(n),3400);
}

/* ---------- account ---------- */
let balAnim=null;
const fmt=n=>Math.round(n).toLocaleString('en-US');
function openAcc(n){
  show('sAcc');
  document.getElementById('uname').textContent='@'+n;
  document.getElementById('avaL').textContent=n[0].toUpperCase();
  document.getElementById('balT').textContent='0';document.getElementById('topBalT').textContent='0';
  document.getElementById('done').style.opacity=0;
  const steps=[gBal];let cur=0,delay=150;
  steps.forEach(to=>{later(()=>{flyCoins(8);countTo(cur,to,1100);cur=to},delay);delay+=1400});
  later(()=>{document.getElementById('done').style.opacity=1},delay);
}
function countTo(a,b,ms){
  const s=performance.now();cancelAnimationFrame(balAnim);
  const cv2=document.getElementById('cval');
  const step=now=>{const k=Math.min(1,(now-s)/ms);const e=1-Math.pow(1-k,3);const v=a+(b-a)*e;
    document.getElementById('balT').textContent=fmt(v);document.getElementById('topBalT').textContent=fmt(v);
    if(Math.random()<.3){cv2.classList.remove('bump');void cv2.offsetWidth;cv2.classList.add('bump')}
    if(k<1)balAnim=requestAnimationFrame(step)};
  balAnim=requestAnimationFrame(step);vib(20);
}
function flyCoins(n){
  const acc=document.getElementById('sAcc');const tgt=document.getElementById('cval').querySelector('img');
  const sr=stage.getBoundingClientRect(),tr=tgt.getBoundingClientRect();
  const tx=(tr.left-sr.left)/SC,ty=(tr.top-sr.top)/SC;
  for(let i=0;i<n;i++){const f=document.createElement('img');f.src=COIN;f.className='fly';
    const sx=rnd(20,SW-60),sy=SH-rnd(40,160);f.style.left=sx+'px';f.style.top=sy+'px';acc.appendChild(f);
    f.animate([{transform:'translate(0,0) scale(.6) rotateY(0)',opacity:0},{opacity:1,offset:.2},{transform:'translate('+(tx-sx)+'px,'+(ty-sy)+'px) scale(1) rotateY(0)',opacity:1}],{duration:700+i*70,easing:'cubic-bezier(.5,0,.6,1)',fill:'forwards'}).onfinish=()=>f.remove();}
}

/* ---------- reset ---------- */
function reset(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(balAnim);show('sGame');initGame()}
document.getElementById('back').addEventListener('click',reset);
document.getElementById('topBal').addEventListener('click',reset);
document.getElementById('gBal').addEventListener('click',reset);
document.getElementById('cval').addEventListener('click',reset);

fit();initGame();requestAnimationFrame(loop);
</script>
